databases:
  - name: movies-db
    plan: free
    databaseName: movies
    user: movies

services:
  - type: web
    name: movies
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: movies-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: TMDB_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false

  - type: worker
    name: movies-worker
    runtime: docker
    plan: free
    dockerCommand: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: movies
          envVarKey: APP_KEY
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: movies-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: TMDB_API_KEY
        fromService:
          type: web
          name: movies
          envVarKey: TMDB_API_KEY
      - key: RAPIDAPI_KEY
        fromService:
          type: web
          name: movies
          envVarKey: RAPIDAPI_KEY

  - type: cron
    name: movies-scheduler
    runtime: docker
    plan: free
    schedule: "* * * * *"
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: movies
          envVarKey: APP_KEY
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: movies-db
          property: connectionString
      - key: CACHE_STORE
        value: database
      - key: TMDB_API_KEY
        fromService:
          type: web
          name: movies
          envVarKey: TMDB_API_KEY
      - key: RAPIDAPI_KEY
        fromService:
          type: web
          name: movies
          envVarKey: RAPIDAPI_KEY
